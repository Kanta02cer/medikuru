    .flow-steps li{position:relative;text-align:center;min-width:0}
    .flow-steps li:not(:last-child):after{content:"";position:absolute;top:20px;right:-15px;width:6px;height:6px;border-top:1px solid #b9b8b1;border-right:1px solid #b9b8b1;transform:rotate(45deg)}

    .flow-steps p{font-size:11px;margin:0;color:#747b80;line-height:1.8}
    .preview-note{margin:30px 0 0;border-top:1px solid #dedaCF;padding-top:20px;text-align:center;font-size:10px;line-height:1.9;color:#8b8e8c}

      .flow{padding:33px 23px 29px}.flow h2{font-size:18px}.flow-steps{gap:15px;margin-top:24px}.flow-number{width:34px;height:34px;font-size:10px;margin-bottom:9px}.flow-steps li:not(:last-child):after{right:-10px;top:16px}.flow-steps h3{font-size:10px}.flow-steps p{font-size:9px;line-height:1.85}.preview-note{font-size:9px;margin-top:25px;padding-top:16px}
    }

    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
